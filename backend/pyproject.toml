[project]
name = "app"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "duckdb==1.2.2",
    "fastapi>=0.143.1",
    "numpy>=2.5.4",
    "openai-codex>=0.167.0",
    "pyarrow>=26",
    "pydantic-ai-slim[openai]>=2,<3",
    "scipy>=1.17",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=1.18",
    "pytest>=8.4",
    "pytest-xdist>=3.8",
    "ruff>=0.14",
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-n", "auto", "--strict-markers"]

[tool.mypy]
strict = true
mypy_path = "src"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["pyarrow.*", "scipy.*"]
ignore_missing_imports = true
